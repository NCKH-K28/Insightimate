<!DOCTYPE html>
<html>
<head>
    <title>Test Delete Comment</title>
</head>
<body>
    <h1>Test Delete Comment API</h1>
    
    <form id="testForm">
        <label>Issue ID: <input type="text" id="issueId" value="is_flooigfnkc1l1kqhnig5ello" /></label><br><br>
        <label>Comment ID: <input type="text" id="commentId" value="pzkl5dcw6xv0ip06kdrz6gjh" /></label><br><br>
        <label>User ID: <input type="text" id="userId" value="test-user-123" /></label><br><br>
        <button type="button" onclick="testDelete()">Test DELETE</button>
        <button type="button" onclick="testPUT()">Test PUT</button>
    </form>

    <div id="result"></div>

    <script>
        async function testDelete() {
            const issueId = document.getElementById('issueId').value;
            const commentId = document.getElementById('commentId').value;
            const userId = document.getElementById('userId').value;
            
            const url = `/api/v2/issues/${issueId}/comments/${commentId}`;
            console.log('🗑️ Testing DELETE:', url);
            
            try {
                const response = await fetch(url, {
                    method: 'DELETE',
                    headers: {
                        'x-user-id': userId
                    }
                });
                
                const result = await response.text();
                
                document.getElementById('result').innerHTML = `
                    <h3>DELETE Result:</h3>
                    <p>Status: ${response.status} ${response.statusText}</p>
                    <p>Response: ${result}</p>
                `;
                
                console.log('DELETE Response:', { status: response.status, result });
            } catch (error) {
                console.error('DELETE Error:', error);
                document.getElementById('result').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }
        
        async function testPUT() {
            const issueId = document.getElementById('issueId').value;
            const commentId = document.getElementById('commentId').value;
            const userId = document.getElementById('userId').value;
            
            const url = `/api/v2/issues/${issueId}/comments/${commentId}`;
            console.log('📝 Testing PUT:', url);
            
            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-id': userId
                    },
                    body: JSON.stringify({ content: 'Updated content test' })
                });
                
                const result = await response.text();
                
                document.getElementById('result').innerHTML = `
                    <h3>PUT Result:</h3>
                    <p>Status: ${response.status} ${response.statusText}</p>
                    <p>Response: ${result}</p>
                `;
                
                console.log('PUT Response:', { status: response.status, result });
            } catch (error) {
                console.error('PUT Error:', error);
                document.getElementById('result').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
