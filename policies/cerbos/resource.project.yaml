# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  importDerivedRoles:
    - common_derived_roles
  resource: "project"
  rules:
    - actions: ["read", "list"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - org_owner
        - org_admin
        - org_member
        - proj_lead
        - proj_member

    - actions: ["update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - org_owner
        - org_admin
        - proj_lead

    - actions: ["manage"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - org_owner
        - org_admin

