name: insightimate-base

networks:
  insightimate_shared_network:
    name: insightimate_shared_network
    driver: bridge

volumes:
  pg_data:
  openfga_db_data:
  minio_data:


services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    command: >
      postgres -c wal_level=logical
               -c max_replication_slots=10
               -c max_wal_senders=10
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - insightimate_shared_network

  cerbos:
    image: ghcr.io/cerbos/cerbos:latest
    container_name: cerbos
    ports:
      - "3592:3592" # HTTP (REST)
      - "3593:3593" # gRPC
    volumes:
      - ./cerbos/policies:/policies:ro
      - ./cerbos/schemas:/schemas:ro
      - ./cerbos/config/cerbos.yaml:/cerbos.yaml:ro
    healthcheck:
      test: [ "CMD", "/cerbos", "healthcheck", "--kind=http", "--host-port=127.0.0.1:3592", "--no-tls" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  openfga_db:
    image: postgres:17
    container_name: openfga_db
    command: [ "postgres", "-c", "max_connections=100" ]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - openfga_db_data:/var/lib/postgresql/data

  migrate:
    image: openfga/openfga:latest
    container_name: migrate
    depends_on:
      openfga_db:
        condition: service_healthy
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:password@openfga_db:5432/postgres?sslmode=disable
    command: migrate
    restart: "no"

  openfga:
    image: openfga/openfga:latest
    container_name: openfga
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: run
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:password@openfga_db:5432/postgres?sslmode=disable
      - OPENFGA_DATASTORE_MAX_OPEN_CONNS=100
      - OPENFGA_PLAYGROUND_ENABLED=true
      - OPENFGA_PLAYGROUND_PORT=3333
    ports:
      - "8080:8080" # http
      # - "8081:8081" # grpc (không cần publish ra host cho healthcheck nội bộ)
      # - "3333:3333" # playground
      # Nếu image có grpc_health_probe thì dùng block dưới; nếu không, chuyển sang HTTP healthcheck
    healthcheck:
      test: [ "CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081" ]
      interval: 5s
      timeout: 30s
      retries: 3
    # --- Hoặc dùng HTTP:
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
    #   interval: 5s
    #   timeout: 10s
    #   retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    volumes:
      - minio_data:/data
    # Lưu ý: nếu image không có curl/wget, healthcheck này sẽ fail
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
