# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  importDerivedRoles:
    - common_derived_roles

  resource: "workspace_member"
  rules:
    # Chặn tự thao tác
    - actions: [revoke, assign_role]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          expr: P.id == R.attr.userId

    # REVOKE
    - actions: [revoke]
      effect: EFFECT_ALLOW
      derivedRoles: [ws_owner]
      condition:
        match:
          expr: R.attr.role in ["WS_ADMIN","WS_MEMBER"]

    - actions: [revoke]
      effect: EFFECT_ALLOW
      derivedRoles: [ws_admin]
      condition:
        match:
          expr: R.attr.role in ["WS_MEMBER"]

    # ASSIGN_ROLE
    # Owner có thể gán mọi role (trừ OWNER đã bị deny ở trên)
    - actions: [assign_role]
      effect: EFFECT_ALLOW
      derivedRoles: [ws_owner]
      condition:
        match:
          expr: R.attr.role in ["WS_ADMIN","WS_MEMBER"]

    # Admin chỉ được gán MEMBER/GUEST, không tạo ADMIN
    - actions: [assign_role]
      effect: EFFECT_ALLOW
      derivedRoles: [ws_admin]
      condition:
        match:
          expr: R.attr.role in ["WS_MEMBER"]
