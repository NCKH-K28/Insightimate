version: "3.8"

services:
  cerbos:
    image: ghcr.io/cerbos/cerbos:latest
    container_name: cerbos
    ports:
      - "3592:3592" # HTTP (REST)
      - "3593:3593" # gRPC
    volumes:
      - ./cerbos/policies:/policies:ro
      - ./cerbos/schemas:/schemas:ro
      # - ./cerbos/config/cerbos.yaml:/cerbos.yaml:ro
    # Healthcheck: kiểm tra HTTP nội bộ
    healthcheck:
      test:
        [
          "CMD",
          "/cerbos",
          "healthcheck",
          "--kind=http",
          "--host-port=127.0.0.1:3592",
          "--no-tls",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  # openfga

  postgres:
    image: postgres:17
    container_name: postgres
    command: postgres -c 'max_connections=100'
    networks:
      - default
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    depends_on:
      postgres:
        condition: service_healthy
    image: openfga/openfga:latest
    container_name: migrate
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:password@postgres:5432/postgres?sslmode=disable
    command: migrate
    networks:
      - default

  openfga:
    depends_on:
      migrate:
        condition: service_completed_successfully
    image: openfga/openfga:latest
    container_name: openfga
    command: run
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:password@postgres:5432/postgres?sslmode=disable
      - OPENFGA_DATASTORE_MAX_OPEN_CONNS=100 #see postgres container
      - OPENFGA_PLAYGROUND_ENABLED=true
    networks:
      - default
    ports:
      - "8080:8080" #http
      # - "8081:8081" #grpc
      - "3333:3000" #playground
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=openfga:8081"]
      interval: 5s
      timeout: 30s
      retries: 3
